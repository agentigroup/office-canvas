<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual AI Research Canvas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Firebase Realtime Database SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #f8fafc;
            user-select: none;
        }

        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            cursor: grab;
        }

        #viewport:active {
            cursor: grabbing;
        }

        #viewport.mode-draw {
            cursor: crosshair !important;
        }

        #viewport.mode-eraser {
            cursor: cell !important;
        }

        #canvas-plane {
            position: absolute;
            width: 8000px;
            height: 8000px;
            transform-origin: 0 0;
            background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        .dock-bar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            border-radius: 20px;
        }

        .dock-btn {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            color: #334155;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .dock-btn:hover {
            background-color: #f1f5f9;
            color: #0f172a;
            transform: scale(1.04);
        }

        .dock-btn.active {
            background-color: #eff6ff;
            color: #2563eb;
            box-shadow: inset 0 0 0 1.5px #3b82f6;
        }

        .canvas-card {
            position: absolute;
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .canvas-card:hover {
            box-shadow: 0 12px 28px -4px rgba(0, 0, 0, 0.12), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
        }

        .canvas-card.selected-card {
            box-shadow: 0 0 0 2px #3b82f6, 0 12px 28px -4px rgba(0, 0, 0, 0.12) !important;
        }

        .connection-port {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #1f2937;
            border: 2px solid white;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s, transform 0.1s;
            cursor: crosshair;
            z-index: 20;
        }

        .canvas-card:hover .connection-port, .connection-port:hover { opacity: 1; }
        .connection-port:hover { transform: scale(1.4); background: #000; }

        .port-top { top: -6px; left: calc(50% - 6px); }
        .port-right { right: -6px; top: calc(50% - 6px); }
        .port-bottom { bottom: -6px; left: calc(50% - 6px); }
        .port-left { left: -6px; top: calc(50% - 6px); }

        .resize-handle {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 16px;
            height: 16px;
            cursor: nwse-resize;
            background: linear-gradient(135deg, transparent 50%, #94a3b8 50%);
            border-bottom-right-radius: inherit;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .canvas-card:hover .resize-handle { opacity: 1; }

        .connection-line {
            cursor: pointer;
            transition: stroke-width 0.1s;
        }
        .connection-line:hover {
            stroke-width: 5px;
            stroke: #ef4444;
        }

        .sketch-path.erasable:hover {
            stroke: #ef4444 !important;
            opacity: 0.8 !important;
            cursor: pointer;
        }

        .matrix-cell.active { background-color: #3b82f6; border-color: #2563eb; }
        .exporting .connection-port, .exporting .resize-handle, .exporting .canvas-card > button { display: none !important; }
    </style>
</head>
<body class="flex h-screen w-screen text-gray-900 antialiased selection:bg-gray-200">

    <!-- ===================== JAVASCRIPT ===================== -->
    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyADVaefaXCa4uUT8SivVYTq8GimffTqV9I",
            authDomain: "office-canvas.firebaseapp.com",
            databaseURL: "https://office-canvas-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "office-canvas",
            storageBucket: "office-canvas.firebasestorage.app",
            messagingSenderId: "650969840831",
            appId: "1:650969840831:web:e4e8c56e38ca5249761a0a",
            measurementId: "G-0QMQGZ9BXP"
        };

        const SHARED_BOARD_ID = 'shared-main-board';
        let db = null;
        let isFirebaseAvailable = false;
        let boardRef = null;
        let isRemoteUpdate = false;
        let saveTimer = null;

        function setSyncStatus(status, text) {
            const dot = document.getElementById('syncDot');
            const label = document.getElementById('syncText');
            if (!dot || !label) return;
            label.textContent = text;
            if (status === 'synced') {
                dot.className = 'w-2 h-2 rounded-full bg-emerald-500';
            } else if (status === 'syncing') {
                dot.className = 'w-2 h-2 rounded-full bg-amber-400 animate-pulse';
            } else {
                dot.className = 'w-2 h-2 rounded-full bg-rose-500';
            }
        }

        function initFirebase() {
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.database();
                isFirebaseAvailable = true;

                db.ref('.info/connected').on('value', snap => {
                    if (snap.val() === true) {
                        setSyncStatus('synced', 'Live Synced');
                    } else {
                        setSyncStatus('syncing', 'Connecting...');
                    }
                });

                listenToBoard();
            } catch (err) {
                console.error("Firebase init error:", err);
                setSyncStatus('offline', 'Offline');
            }
        }

        function listenToBoard() {
            if (!db) return;
            boardRef = db.ref('boards/' + SHARED_BOARD_ID);
            boardRef.on('value', snap => {
                const data = snap.val();
                if (!data) return;

                if (isPanning || isDrawing) return;

                isRemoteUpdate = true;
                cards = Array.isArray(data.cards) ? data.cards : (data.cards ? Object.values(data.cards) : []);
                connections = Array.isArray(data.connections) ? data.connections : (data.connections ? Object.values(data.connections) : []);
                sketches = Array.isArray(data.sketches) ? data.sketches : (data.sketches ? Object.values(data.sketches) : []);
                
                renderBoard();
                renderSketches();
                setSyncStatus('synced', 'Live Synced');
                isRemoteUpdate = false;
            }, err => {
                console.error("Firebase error:", err);
                setSyncStatus('offline', 'Rule Denied');
            });
        }

        function saveToFirebase() {
            if (!db || isRemoteUpdate) return;
            setSyncStatus('syncing', 'Saving...');
            clearTimeout(saveTimer);
            saveTimer = setTimeout(() => {
                boardRef.set({ cards, connections, sketches, updatedAt: Date.now() })
                    .then(() => setSyncStatus('synced', 'Live Synced'))
                    .catch(() => setSyncStatus('offline', 'Save Error'));
            }, 300);
        }

        // Canvas State
        let cards = [];
        let connections = [];
        let sketches = [];
        let historyStack = [];
        let redoStack = [];

        let activeTool = 'select';
        let currentPenColor = '#2563eb';
        let currentPenWidth = 6;
        let isDrawing = false;
        let currentPathPoints = [];
        let tempSketchPath = null;

        let scale = 1.0;
        let panX = -3500;
        let panY = -3500;
        let isPanning = false;
        let startX = 0, startY = 0;
        let matrixR = 1, matrixC = 1;

        const viewport = document.getElementById('viewport');
        const plane = document.getElementById('canvas-plane');
        const cardsContainer = document.getElementById('cards-container');
        const sketchesGroup = document.getElementById('sketches-group');
        const connectionsGroup = document.getElementById('connections-group');

        window.addEventListener('load', () => {
            initFirebase();
            updateTransform();
            renderBoard();
            setupViewport();
            setupGridMatrix();
            setupDragAndDrop();
        });

        function updateTransform() {
            plane.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            document.getElementById('zoomDisplay').textContent = Math.round(scale * 100) + '%';
        }

        function zoomAtPoint(newScale, cx, cy) {
            newScale = Math.min(Math.max(0.2, newScale), 2.5);
            const rect = viewport.getBoundingClientRect();
            const px = (cx !== undefined) ? cx - rect.left : rect.width / 2;
            const py = (cy !== undefined) ? cy - rect.top : rect.height / 2;
            panX = px - (px - panX) * (newScale / scale);
            panY = py - (py - panY) * (newScale / scale);
            scale = newScale;
            updateTransform();
        }

        function zoomCanvas(delta) { zoomAtPoint(scale + delta); }
        function resetZoom() { scale = 1.0; panX = -3500; panY = -3500; updateTransform(); }

        function getCanvasCenter() {
            const rect = viewport.getBoundingClientRect();
            return {
                x: Math.round((rect.width / 2 - panX) / scale - 120),
                y: Math.round((rect.height / 2 - panY) / scale - 80)
            };
        }

        function pushHistory() {
            historyStack.push(JSON.stringify({ cards, connections, sketches }));
            if (historyStack.length > 30) historyStack.shift();
            redoStack = [];
        }

        function undo() {
            if (!historyStack.length) return;
            redoStack.push(JSON.stringify({ cards, connections, sketches }));
            const prev = JSON.parse(historyStack.pop());
            cards = prev.cards || []; connections = prev.connections || []; sketches = prev.sketches || [];
            saveToFirebase(); renderBoard(); renderSketches();
        }

        function redo() {
            if (!redoStack.length) return;
            historyStack.push(JSON.stringify({ cards, connections, sketches }));
            const next = JSON.parse(redoStack.pop());
            cards = next.cards || []; connections = next.connections || []; sketches = next.sketches || [];
            saveToFirebase(); renderBoard(); renderSketches();
        }

        function setActiveTool(tool) {
            activeTool = tool;
            document.querySelectorAll('.dock-bar .dock-btn').forEach(btn => btn.classList.remove('active'));
            viewport.classList.remove('mode-draw', 'mode-eraser');

            if (tool === 'select') {
                document.getElementById('btn-select').classList.add('active');
                document.getElementById('sketch-sub-dock').classList.add('hidden');
            } else if (tool === 'pen' || tool === 'eraser') {
                document.getElementById('btn-pen').classList.add('active');
                document.getElementById('sketch-sub-dock').classList.remove('hidden');
                if (tool === 'eraser') {
                    viewport.classList.add('mode-eraser');
                    document.getElementById('btn-pen-sub').classList.remove('active');
                    document.getElementById('btn-eraser-sub').classList.add('active');
                } else {
                    viewport.classList.add('mode-draw');
                    document.getElementById('btn-eraser-sub').classList.remove('active');
                    document.getElementById('btn-pen-sub').classList.add('active');
                }
            }
        }

        function togglePenMode() { setActiveTool(activeTool === 'pen' ? 'select' : 'pen'); }
        function setSketchType(t) { setActiveTool(t); }
        function setPenWidth(w) { currentPenWidth = w; }

        function toggleCustomPopover(id, event) {
            if (event) event.stopPropagation();
            closePopovers();
            const p = document.getElementById(id);
            if (p) p.classList.toggle('hidden');
        }
        function closePopovers() {
            document.querySelectorAll('.popover-menu').forEach(el => el.classList.add('hidden'));
        }

        window.addEventListener('click', (e) => {
            if (!e.target.closest('.popover-menu') && !e.target.closest('.dock-btn')) closePopovers();
        });

        function setupGridMatrix() {
            const matrix = document.getElementById('grid-matrix');
            if (!matrix) return;
            matrix.innerHTML = '';
            for (let r = 1; r <= 5; r++) {
                for (let c = 1; c <= 8; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'matrix-cell w-5 h-5 border border-gray-200 rounded-sm hover:border-blue-500 cursor-pointer';
                    cell.onmouseenter = () => {
                        matrixR = r; matrixC = c;
                        document.getElementById('grid-matrix-label').textContent = `${r} x ${c} Table`;
                        document.querySelectorAll('.matrix-cell').forEach((item, idx) => {
                            const ir = Math.floor(idx / 8) + 1;
                            const ic = (idx % 8) + 1;
                            item.classList.toggle('active', ir <= r && ic <= c);
                        });
                    };
                    cell.onclick = () => { addGridDirectly(); closePopovers(); };
                    matrix.appendChild(cell);
                }
            }
        }

        function addCardDirectly(type) {
            pushHistory();
            const pos = getCanvasCenter();
            const card = { id: Date.now().toString(), type, x: pos.x, y: pos.y, width: 240, height: 180 };
            if (type === 'note') { card.title = "Sticky Note"; card.content = "Write something..."; }
            else if (type === 'text') { card.width = 180; card.height = 50; card.content = "Enter plain text..."; }
            else if (type === 'comment') { card.width = 250; card.height = 150; card.title = "Comment"; card.content = "Feedback here..."; }
            else if (type === 'checklist') { card.width = 260; card.height = 200; card.title = "Tasks"; card.items = []; }
            cards.push(card);
            saveToFirebase();
            renderBoard();
        }

        function addGridDirectly() {
            pushHistory();
            const pos = getCanvasCenter();
            cards.push({ id: Date.now().toString(), type: 'grid', x: pos.x, y: pos.y, width: 450, height: 300, rows: matrixR, cols: matrixC, title: "Grid Table" });
            saveToFirebase();
            renderBoard();
        }

        function addShapeDirectly(shapeType) {
            pushHistory();
            const pos = getCanvasCenter();
            cards.push({ id: Date.now().toString(), type: 'shape', x: pos.x, y: pos.y, width: 120, height: 120, shapeType });
            saveToFirebase();
            renderBoard();
            closePopovers();
        }

        function setupDragAndDrop() {
            viewport.addEventListener('dragover', e => e.preventDefault());
            viewport.addEventListener('drop', e => {
                e.preventDefault();
                const raw = e.dataTransfer.getData('text/plain');
                if (!raw) return;
                try {
                    const data = JSON.parse(raw);
                    const rect = viewport.getBoundingClientRect();
                    const dropX = Math.round((e.clientX - rect.left - panX) / scale - 100);
                    const dropY = Math.round((e.clientY - rect.top - panY) / scale - 50);
                    pushHistory();
                    cards.push({ id: Date.now().toString(), type: data.type, x: dropX, y: dropY, width: 240, height: 180, title: "Note", content: "Write something..." });
                    saveToFirebase();
                    renderBoard();
                } catch (err) {}
            });
        }
        function startPaletteDrag(e, type) { e.dataTransfer.setData('text/plain', JSON.stringify({ type })); }

        // Render Canvas
        function renderBoard() {
            cardsContainer.innerHTML = '';
            cards.forEach(card => {
                const div = document.createElement('div');
                div.id = `card-${card.id}`;
                div.className = 'canvas-card absolute bg-white rounded-2xl border border-gray-200 shadow-md p-4 flex flex-col cursor-move select-none';
                div.style.left = `${card.x}px`;
                div.style.top = `${card.y}px`;
                div.style.width = `${card.width || 240}px`;
                div.style.height = `${card.height || 180}px`;

                let inner = '';
                if (card.type === 'note' || card.type === 'comment') {
                    inner = `
                        <div class="font-bold text-xs mb-2 border-b pb-1 flex justify-between items-center">
                            <span contenteditable="true" onblur="updateCardField('${card.id}', 'title', this.textContent)">${escapeHtml(card.title || 'Note')}</span>
                            <button onclick="deleteCard('${card.id}')" class="text-gray-400 hover:text-rose-500">✕</button>
                        </div>
                        <div class="text-xs text-gray-700 flex-grow outline-none overflow-y-auto" contenteditable="true" onblur="updateCardField('${card.id}', 'content', this.innerHTML)">${card.content || ''}</div>
                    `;
                } else if (card.type === 'text') {
                    div.className += ' bg-transparent border-none shadow-none p-1';
                    inner = `<div class="text-sm font-semibold outline-none w-full h-full" contenteditable="true" onblur="updateCardField('${card.id}', 'content', this.innerHTML)">${card.content || 'Text'}</div>`;
                } else if (card.type === 'checklist') {
                    inner = `
                        <div class="font-bold text-xs mb-2 border-b pb-1 flex justify-between items-center">
                            <span contenteditable="true" onblur="updateCardField('${card.id}', 'title', this.textContent)">${escapeHtml(card.title || 'Tasks')}</span>
                            <button onclick="deleteCard('${card.id}')" class="text-gray-400 hover:text-rose-500">✕</button>
                        </div>
                        <div class="space-y-1.5 flex-grow overflow-y-auto">
                            ${(card.items || []).map((it, idx) => `
                                <div class="flex items-center space-x-2 text-xs">
                                    <input type="checkbox" ${it.checked ? 'checked' : ''} onchange="toggleTask('${card.id}', ${idx})" class="rounded">
                                    <span class="${it.checked ? 'line-through text-gray-400' : ''}">${escapeHtml(it.text)}</span>
                                </div>
                            `).join('')}
                        </div>
                        <button onclick="addTaskItem('${card.id}')" class="mt-2 text-[11px] text-blue-600 font-bold hover:underline text-left">+ Add item</button>
                    `;
                } else if (card.type === 'shape') {
                    div.className += ' bg-transparent border-none shadow-none flex items-center justify-center p-0';
                    inner = `
                        <svg class="w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none">
                            ${card.shapeType === 'circle' ? '<circle cx="50" cy="50" r="46" fill="#eff6ff" stroke="#3b82f6" stroke-width="4"/>' : ''}
                            ${card.shapeType === 'triangle' ? '<polygon points="50,6 6,94 94,94" fill="#eff6ff" stroke="#3b82f6" stroke-width="4"/>' : ''}
                            ${(!card.shapeType || card.shapeType === 'rect') ? '<rect x="4" y="4" width="92" height="92" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="4"/>' : ''}
                        </svg>
                        <button onclick="deleteCard('${card.id}')" class="absolute top-1 right-1 text-gray-400 hover:text-rose-500 text-xs">✕</button>
                    `;
                } else if (card.type === 'grid') {
                    inner = `
                        <div class="font-bold text-xs mb-2 border-b pb-1 flex justify-between items-center">
                            <span>${escapeHtml(card.title || 'Table')}</span>
                            <button onclick="deleteCard('${card.id}')" class="text-gray-400 hover:text-rose-500">✕</button>
                        </div>
                        <div class="grid gap-1 flex-grow border border-gray-100 p-1 rounded-lg" style="grid-template-columns: repeat(${card.cols || 2}, 1fr); grid-template-rows: repeat(${card.rows || 2}, 1fr);">
                            ${Array((card.rows || 2) * (card.cols || 2)).fill('<div class="border border-gray-200 rounded p-1 text-[10px] text-gray-400 bg-gray-50/50">Cell</div>').join('')}
                        </div>
                    `;
                }

                const ports = `
                    <div class="connection-port port-top" onmousedown="startConn(event, '${card.id}', 'top')"></div>
                    <div class="connection-port port-right" onmousedown="startConn(event, '${card.id}', 'right')"></div>
                    <div class="connection-port port-bottom" onmousedown="startConn(event, '${card.id}', 'bottom')"></div>
                    <div class="connection-port port-left" onmousedown="startConn(event, '${card.id}', 'left')"></div>
                    <div class="resize-handle" onmousedown="startResize(event, '${card.id}')"></div>
                `;

                div.innerHTML = inner + ports;

                // Drag card
                div.addEventListener('mousedown', (e) => {
                    if (e.target.closest('button') || e.target.closest('input') || e.target.isContentEditable || e.target.classList.contains('connection-port') || e.target.classList.contains('resize-handle')) return;
                    e.stopPropagation();

                    const startMX = e.clientX, startMY = e.clientY;
                    const startCX = card.x, startCY = card.y;

                    function onMove(me) {
                        card.x = Math.round(startCX + (me.clientX - startMX) / scale);
                        card.y = Math.round(startCY + (me.clientY - startMY) / scale);
                        div.style.left = card.x + 'px';
                        div.style.top = card.y + 'px';
                        renderConnections();
                    }

                    function onUp() {
                        window.removeEventListener('mousemove', onMove);
                        window.removeEventListener('mouseup', onUp);
                        saveToFirebase();
                    }

                    window.addEventListener('mousemove', onMove);
                    window.addEventListener('mouseup', onUp);
                });

                cardsContainer.appendChild(div);
            });

            renderConnections();
        }

        function updateCardField(id, f, val) {
            const c = cards.find(item => item.id === id);
            if (c) { c[f] = val; saveToFirebase(); }
        }

        function deleteCard(id) {
            pushHistory();
            cards = cards.filter(c => c.id !== id);
            connections = connections.filter(conn => conn.from !== id && conn.to !== id);
            saveToFirebase();
            renderBoard();
        }

        function toggleTask(cardId, idx) {
            const c = cards.find(item => item.id === cardId);
            if (c && c.items && c.items[idx]) {
                c.items[idx].checked = !c.items[idx].checked;
                saveToFirebase();
                renderBoard();
            }
        }

        function addTaskItem(cardId) {
            const c = cards.find(item => item.id === cardId);
            if (!c) return;
            const text = prompt('Task:');
            if (text && text.trim()) {
                if (!c.items) c.items = [];
                c.items.push({ text: text.trim(), checked: false });
                saveToFirebase();
                renderBoard();
            }
        }

        function startResize(e, id) {
            e.stopPropagation();
            const c = cards.find(item => item.id === id);
            if (!c) return;
            const sx = e.clientX, sy = e.clientY, sw = c.width || 240, sh = c.height || 180;
            function onMove(me) {
                c.width = Math.max(140, Math.round(sw + (me.clientX - sx) / scale));
                c.height = Math.max(80, Math.round(sh + (me.clientY - sy) / scale));
                const el = document.getElementById(`card-${id}`);
                if (el) { el.style.width = c.width + 'px'; el.style.height = c.height + 'px'; }
                renderConnections();
            }
            function onUp() {
                window.removeEventListener('mousemove', onMove);
                window.removeEventListener('mouseup', onUp);
                saveToFirebase();
            }
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onUp);
        }

        // Connections
        function startConn(e, fromId, port) {
            e.stopPropagation();
            const p1 = getPortPos(fromId, port);
            function onMove(me) {
                const rect = viewport.getBoundingClientRect();
                const curX = (me.clientX - rect.left - panX) / scale;
                const curY = (me.clientY - rect.top - panY) / scale;
                renderConnections({ x1: p1.x, y1: p1.y, x2: curX, y2: curY });
            }
            function onUp(ue) {
                window.removeEventListener('mousemove', onMove);
                window.removeEventListener('mouseup', onUp);
                const target = ue.target.closest('.connection-port');
                if (target) {
                    const toCard = target.closest('.canvas-card');
                    if (toCard && toCard.id.replace('card-', '') !== fromId) {
                        pushHistory();
                        connections.push({ id: 'conn-' + Date.now(), from: fromId, to: toCard.id.replace('card-', ''), fromPort: port, toPort: 'top' });
                        saveToFirebase();
                    }
                }
                renderConnections();
            }
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onUp);
        }

        function getPortPos(id, port) {
            const c = cards.find(item => item.id === id);
            if (!c) return { x: 0, y: 0 };
            const w = c.width || 240, h = c.height || 180;
            if (port === 'top') return { x: c.x + w / 2, y: c.y };
            if (port === 'bottom') return { x: c.x + w / 2, y: c.y + h };
            if (port === 'left') return { x: c.x, y: c.y + h / 2 };
            return { x: c.x + w, y: c.y + h / 2 };
        }

        function renderConnections(tempLine) {
            connectionsGroup.innerHTML = '';
            connections.forEach(conn => {
                const p1 = getPortPos(conn.from, conn.fromPort || 'bottom');
                const p2 = getPortPos(conn.to, conn.toPort || 'top');
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', `M ${p1.x} ${p1.y} C ${p1.x} ${(p1.y + p2.y) / 2}, ${p2.x} ${(p1.y + p2.y) / 2}, ${p2.x} ${p2.y}`);
                path.setAttribute('stroke', '#1f2937');
                path.setAttribute('stroke-width', '2.5');
                path.setAttribute('fill', 'none');
                path.setAttribute('marker-end', 'url(#arrow)');
                path.classList.add('connection-line');
                path.onclick = () => {
                    connections = connections.filter(c => c.id !== conn.id);
                    saveToFirebase();
                    renderConnections();
                };
                connectionsGroup.appendChild(path);
            });
            if (tempLine) {
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', `M ${tempLine.x1} ${tempLine.y1} L ${tempLine.x2} ${tempLine.y2}`);
                path.setAttribute('stroke', '#3b82f6');
                path.setAttribute('stroke-width', '2');
                path.setAttribute('stroke-dasharray', '5,5');
                path.setAttribute('fill', 'none');
                connectionsGroup.appendChild(path);
            }
        }

        // Sketches
        function setupViewport() {
            viewport.addEventListener('mousedown', (e) => {
                if (e.target.closest('.dock-bar') || e.target.closest('.popover-menu') || e.target.closest('#boardSwitcherRoot') || e.target.closest('.canvas-card')) return;
                closePopovers();

                const rect = viewport.getBoundingClientRect();
                const cx = (e.clientX - rect.left - panX) / scale;
                const cy = (e.clientY - rect.top - panY) / scale;

                if (activeTool === 'pen') {
                    isDrawing = true;
                    currentPathPoints = [{ x: cx, y: cy }];
                    tempSketchPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    tempSketchPath.setAttribute('stroke', currentPenColor);
                    tempSketchPath.setAttribute('stroke-width', currentPenWidth);
                    tempSketchPath.setAttribute('fill', 'none');
                    tempSketchPath.setAttribute('stroke-linecap', 'round');
                    tempSketchPath.setAttribute('stroke-linejoin', 'round');
                    sketchesGroup.appendChild(tempSketchPath);
                    return;
                }

                isPanning = true;
                startX = e.clientX - panX;
                startY = e.clientY - panY;
            });

            window.addEventListener('mousemove', (e) => {
                if (isDrawing && tempSketchPath) {
                    const rect = viewport.getBoundingClientRect();
                    currentPathPoints.push({ x: (e.clientX - rect.left - panX) / scale, y: (e.clientY - rect.top - panY) / scale });
                    tempSketchPath.setAttribute('d', genPathD(currentPathPoints));
                    return;
                }
                if (isPanning) {
                    panX = e.clientX - startX;
                    panY = e.clientY - startY;
                    updateTransform();
                }
            });

            window.addEventListener('mouseup', () => {
                if (isDrawing && tempSketchPath) {
                    isDrawing = false;
                    if (currentPathPoints.length > 1) {
                        pushHistory();
                        sketches.push({ id: 's-' + Date.now(), color: currentPenColor, width: currentPenWidth, d: genPathD(currentPathPoints) });
                        saveToFirebase();
                    }
                    if (tempSketchPath.parentNode) tempSketchPath.parentNode.removeChild(tempSketchPath);
                    tempSketchPath = null;
                    renderSketches();
                }
                isPanning = false;
            });

            viewport.addEventListener('wheel', (e) => {
                e.preventDefault();
                panX -= e.deltaX;
                panY -= e.deltaY;
                updateTransform();
            }, { passive: false });
        }

        function genPathD(pts) {
            if (!pts || pts.length < 2) return '';
            let d = `M ${pts[0].x} ${pts[0].y}`;
            for (let i = 1; i < pts.length; i++) d += ` L ${pts[i].x} ${pts[i].y}`;
            return d;
        }

        function renderSketches() {
            sketchesGroup.innerHTML = '';
            sketches.forEach(s => {
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', s.d);
                path.setAttribute('stroke', s.color || '#2563eb');
                path.setAttribute('stroke-width', s.width || 6);
                path.setAttribute('fill', 'none');
                path.setAttribute('stroke-linecap', 'round');
                path.setAttribute('stroke-linejoin', 'round');
                if (activeTool === 'eraser') {
                    path.classList.add('erasable');
                    path.style.pointerEvents = 'stroke';
                    path.onclick = () => {
                        sketches = sketches.filter(item => item.id !== s.id);
                        saveToFirebase();
                        renderSketches();
                    };
                } else {
                    path.style.pointerEvents = 'none';
                }
                sketchesGroup.appendChild(path);
            });
        }

        function clearAllSketches() { pushHistory(); sketches = []; saveToFirebase(); renderSketches(); }

        // Admin Modals
        function openAdminPinModal() { document.getElementById('adminPinModal').classList.remove('hidden'); }
        function closeAdminPinModal() { document.getElementById('adminPinModal').classList.add('hidden'); }
        function verifyAdminPin() {
            if (document.getElementById('adminPinInput').value === '0000') {
                closeAdminPinModal();
                document.getElementById('adminPanelModal').classList.remove('hidden');
            } else {
                alert('Wrong PIN. Default is 0000');
            }
        }
        function closeAdminPanelModal() { document.getElementById('adminPanelModal').classList.add('hidden'); }
        function clearEntireBoard() {
            if (confirm('Clear everything on the board?')) {
                pushHistory();
                cards = []; connections = []; sketches = [];
                saveToFirebase();
                renderBoard();
                renderSketches();
                closeAdminPanelModal();
            }
        }

        function applySearch(q) {
            q = (q || '').toLowerCase().trim();
            cards.forEach(c => {
                const el = document.getElementById(`card-${c.id}`);
                if (!el) return;
                const match = !q || `${c.title || ''} ${c.content || ''}`.toLowerCase().includes(q);
                el.style.opacity = match ? '1' : '0.2';
            });
        }

        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s == null ? '' : s;
            return d.innerHTML;
        }
    </script>
</body>
